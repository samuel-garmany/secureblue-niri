---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: secureblue-niri
# description will be included in the image's metadata
description: A hardened niri desktop, built on secureblue.

base-image: ghcr.io/secureblue/sericea-main-hardened
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      files:
        - terra.repo
      keys:
        # Must match gpgkey= in terra.repo, release included.
        - https://repos.fyralabs.com/terra44/key.asc
    install:
      install-weak-deps: false
      packages:
        - niri
        - noctalia
        - xwayland-satellite

        - greetd
        - greetd-selinux
        - noctalia-greeter

        # niri-portals.conf asks for gnome, then gtk. Without the gnome
        # backend nothing on the system implements ScreenCast.
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk

        # ddcutil drives external monitors over DDC/CI, brightnessctl
        # internal laptop panels. Different hardware, both wanted.
        - ddcutil
        - brightnessctl

        - ghostty
        - xdg-terminal-exec

        - playerctl
        - wl-mirror
        - wl-clipboard
        - cliphist
    remove:
      packages:
        - sway
        - sway-config-fedora
        - sddm
        - sddm-wayland-sway

  - type: systemd
    system:
      enabled:
        - greetd.service
      masked:
        - sddm.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
