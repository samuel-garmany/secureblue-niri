---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: secureblue-niri
# description will be included in the image's metadata
description: A hardened niri desktop, built on secureblue.

base-image: ghcr.io/secureblue/sericea-main-hardened
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      files:
        - terra.repo
      keys:
        - https://repos.fyralabs.com/terra44/key.asc
    install:
      install-weak-deps: false
      packages:
        - niri
        - noctalia
        - xwayland-satellite

        - gnome-keyring

        - greetd
        - greetd-selinux
        - noctalia-greeter

        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk

        - brightnessctl

        - nautilus
        - file-roller
        - sushi
        - gnome-disk-utility
        - glycin-thumbnailer
        - xdg-user-dirs-gtk

        - gvfs-goa
        - gvfs-archive
        - gvfs-afc
        - gvfs-gphoto2
        - gvfs-fuse

        - localsearch
        - tinysparql

        - ghostty
        - xdg-terminal-exec

        - wl-mirror
        - wl-clipboard
    remove:
      packages:
        - sway
        - sway-config-fedora
        - sddm
        - sddm-wayland-sway

        - waybar
        - rofi
        - foot
        - swaybg
        - swaylock
        - swayidle
        - wlsunset
        - kanshi
        - imv
        - pavucontrol
        - blueman
        - network-manager-applet

        - thunar-archive-plugin
        - Thunar
        - tumbler
        - xarchiver
        - exo
        - garcon
        - xfconf
        - xfce4-panel
        - libxfce4ui
        - libxfce4windowing
        - libxfce4util

        - xdg-desktop-portal-wlr
        - grim
        - slurp

  - type: script
    scripts:
      - pam-fde-boot-pw.sh

  - type: script
    snippets:
      - >-
        sed -i -e 's|^Exec=|Exec=/usr/bin/env SNAP_NAME=nautilus |'
        /usr/share/applications/org.gnome.Nautilus.desktop
        /usr/share/dbus-1/services/org.gnome.Nautilus.service
        /usr/share/dbus-1/services/org.freedesktop.FileManager1.service

  - type: systemd
    system:
      enabled:
        - greetd.service
      masked:
        - sddm.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
