---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: secureblue-niri
# description will be included in the image's metadata
description: A hardened niri desktop, built on secureblue.

base-image: ghcr.io/secureblue/sericea-main-hardened
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      files:
        - terra.repo
    install:
      install-weak-deps: false
      packages:
        - niri
        - noctalia
        - xwayland-satellite

        - greetd
        - greetd-selinux
        - noctalia-greeter

        - gnome-keyring

        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk

        - nautilus
        - file-roller
        - sushi
        - gnome-disk-utility
        - glycin-thumbnailer

        - gvfs-archive
        - gvfs-afc
        - gvfs-gphoto2
        - gvfs-fuse

        - localsearch
        - tinysparql

        - ghostty

        - fish

        - wl-mirror
    remove:
      packages:
        - rofi
        - foot
        - dunst
        - wlsunset
        - kanshi
        - imv
        - pavucontrol
        - blueman
        - network-manager-applet

        - thunar-archive-plugin
        - Thunar
        - tumbler
        - xarchiver
        - exo
        - garcon
        - xfconf
        - xfce4-panel
        - libxfce4ui
        - libxfce4windowing
        - libxfce4util

        - xdg-desktop-portal-wlr

        - sway
        - sway-config-fedora
        - sway-systemd
        - grimshot
        - waybar
        - swaylock
        - swayidle
        - swaybg
        - lxqt-policykit
        - sddm
        - sddm-wayland-sway

  - type: script
    scripts:
      - pam-fde-boot-pw.sh

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
